<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit de tarjetas | LEGION</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Cinzel:wght@600;800&family=Orbitron:wght@600;900&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Russo+One&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", sans-serif; background: #DDD9D2; padding: 20px; }
  .hoja { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
  .par { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .t { position: relative; overflow: hidden; flex-shrink: 0; box-shadow: 0 12px 26px -12px rgba(0,0,0,.55); border-radius: 3.2mm; color: #fff; }
  .v { width: 53.98mm; height: 85.6mm; }
  .h { width: 85.6mm; height: 53.98mm; }
  .abs { position: absolute; }
  .qr { background: #fff; border-radius: 1.6mm; padding: 1mm; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .nfcz { position: absolute; width: 27mm; height: 27mm; border-radius: 50%; display: grid; place-items: center; text-align: center; }
  .nfcz::before { content: ""; position: absolute; inset: -1.2mm; border-radius: 50%; border: .35mm dashed currentColor; opacity: .55; }
  .nfcz small { font-size: 1.7mm; font-weight: 800; letter-spacing: .3mm; opacity: .7; }
  .ondas { width: 7mm; height: 7mm; }
  .tap { display: flex; align-items: center; gap: 1.8mm; }
  .tap b { display: block; font-size: 2.5mm; line-height: 1.1; }
  .tap small { display: block; font-size: 1.85mm; opacity: .75; line-height: 1.2; }
  .lst { list-style: none; display: grid; gap: 1.1mm; }
  .lst li { display: flex; align-items: center; gap: 1.6mm; font-size: 2.2mm; font-weight: 700; }
  .lst li i { width: 1.6mm; height: 1.6mm; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .leg { font-size: 1.55mm; opacity: .6; line-height: 1.25; }
  .legion { font-size: 1.7mm; letter-spacing: .25mm; opacity: .75; }
  .legion b { letter-spacing: .5mm; }
  .placa { display: inline-flex; flex-direction: column; align-items: center; background: linear-gradient(180deg,#FFE14D,#F2C200); color: #111; border: .5mm solid #111; border-radius: 1.4mm; padding: .4mm 3mm .2mm; font-family: "Plus Jakarta Sans"; }
  .placa b { font-size: 6.2mm; letter-spacing: .6mm; line-height: 1; font-weight: 800; }
  .placa small { font-size: 1.3mm; font-weight: 800; letter-spacing: .5mm; }
  .silueta { position: absolute; }
  @page { margin: 0; }
  @page v { size: 53.98mm 85.6mm; margin: 0; }
  @page h { size: 85.6mm 53.98mm; margin: 0; }
  @media print {
    body { background: none; padding: 0; }
    .hoja, .par { display: block; }
    .t { border-radius: 0; box-shadow: none; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .t.v { page: v; } .t.h { page: h; }
    .nota { display: none; }
  }
  .nota { max-width: 900px; margin: 0 auto 18px; background: #fff; border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="nota" id="nota"></div>
<div class="hoja" id="hoja"></div>
<script>
const P = new URLSearchParams(location.search), GRUPO = P.get("grupo") || "negocios";
const BASE = "https://legionestudio.com/";
const qr = (slug, size) => { const q = qrcode(0, "M"); q.addData(BASE + slug + "/"); q.make(); return `<div class="qr abs" style="${size}">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>`; };
const ondas = (c = "currentColor") => `<svg class="ondas" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"/><path d="M5 11v2"/></svg>`;
const tap = (t, s, c) => `<div class="tap"><span style="width:8.5mm;height:8.5mm;border-radius:50%;display:grid;place-items:center;background:${c}">${ondas()}</span><div><b>${t}</b><small>${s}</small></div></div>`;
// Zona del sticker NFC en el reverso (centrada a lo ancho para que cuadre al voltear la tarjeta)
const zona = (top, c, fondo) => `<div class="nfcz" style="top:${top};left:50%;transform:translateX(-50%);color:${c};background:${fondo}">${ondas()}<small style="position:absolute;bottom:4mm">STICKER NFC</small></div>`;
const zonaH = (left, top, c, fondo) => `<div class="nfcz" style="top:${top};left:${left};color:${c};background:${fondo};width:24mm;height:24mm">${ondas()}<small style="position:absolute;bottom:3.4mm">NFC</small></div>`;
const lista = (items, c) => `<ul class="lst" style="color:${c}">${items.map((t) => `<li><i></i>${t}</li>`).join("")}</ul>`;
const CARRO = (c, w, op = 1) => `<svg viewBox="0 0 200 64" style="width:${w};opacity:${op}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 46c2-8 18-12 38-14l22-12c10-5 42-7 62-4 16 3 28 10 38 16 14 2 22 6 24 12v6h-14"/><path d="M146 52H62M30 52H8v-6"/><circle cx="46" cy="50" r="10"/><circle cx="160" cy="50" r="10"/><path d="M74 25l12-6c14-3 32-3 42 0l14 11H76z"/><path d="M178 40h12M10 42h10"/></svg>`;
const MOTO = (c, w, op = 1) => `<svg viewBox="0 0 200 110" style="width:${w};opacity:${op}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><circle cx="42" cy="80" r="24"/><circle cx="160" cy="80" r="24"/><circle cx="42" cy="80" r="6"/><circle cx="160" cy="80" r="6"/><path d="M42 80l34-28h44l40 28"/><path d="M84 46c4-14 34-18 44-6l-8 12H80z"/><path d="M128 40l10-16 16 2M138 24l-6-6"/><path d="M76 52l-18-14H40l-6 8"/><path d="M96 56l14 24h-36"/></svg>`;

/* ===== Piezas comunes ===== */
const F = (n) => `/tarjeta/fotos/${n}`;
const foto = (src, pos = "center", extra = "") => `<img class="abs" src="${src}" style="inset:0;width:100%;height:100%;object-fit:cover;object-position:${pos};${extra}">`;
const capa = (bg) => `<div class="abs" style="inset:0;background:${bg}"></div>`;
// Blanco de toque NFC: 30 mm, protagonista del reverso (ahí va el sticker)
const blanco = (x, y, ac, txt = "TOCA AQUÍ") => `<div class="abs" style="left:${x};top:${y};width:36.4mm;height:36.4mm;transform:translate(-50%,-50%)">
  <svg class="abs" viewBox="0 0 364 364" style="inset:0;width:100%;height:100%">
    <defs><radialGradient id="g${ac.slice(1)}"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".7" stop-color="#000" stop-opacity=".35"/></radialGradient></defs>
    <circle cx="182" cy="182" r="179" fill="none" stroke="${ac}" stroke-width="2.5" opacity=".35"/>
    <circle cx="182" cy="182" r="163" fill="none" stroke="${ac}" stroke-width="3.5" opacity=".75"/>
    <circle cx="182" cy="182" r="150" fill="url(#g${ac.slice(1)})"/></svg>
  <div class="abs" style="inset:0;display:grid;place-items:center;color:${ac}">
    <svg viewBox="0 0 24 24" style="width:10mm;height:10mm" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"/><path d="M5 11v2"/></svg></div>
  <div class="abs" style="left:0;right:0;bottom:7.4mm;text-align:center;font:800 1.75mm 'Plus Jakarta Sans';letter-spacing:.55mm;color:${ac}">${txt}</div></div>`;
const qrc = (slug, css) => qr(slug, css + ";padding:.8mm;border-radius:1.2mm");
const marcaNFC = (c) => `<span style="display:inline-flex;align-items:center;gap:1.2mm;font:800 1.75mm 'Plus Jakarta Sans';letter-spacing:.5mm;color:${c}"><svg viewBox="0 0 24 24" style="width:3.6mm;height:3.6mm" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8.5 8.5a5 5 0 0 1 0 7M12 6a8.5 8.5 0 0 1 0 12M15.5 3.5a12 12 0 0 1 0 17"/></svg>TOCA · ESCANEA</span>`;

/* ===== NEGOCIOS: vertical, foto protagonista ===== */
const neg = (o) => ({
  slug: o.slug, nombre: o.nombre,
  f: () => `<div class="t v" style="background:${o.oscuro}">
    ${foto(o.foto, o.pos, "filter:contrast(1.08) saturate(1.12)")}
    ${capa(`linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 42%,${o.oscuro}E6 70%,${o.oscuro} 100%)`)}
    <div class="abs" style="top:4.5mm;left:0;right:0;display:flex;justify-content:center">${o.logo}</div>
    <div class="abs" style="left:4.6mm;right:4.6mm;bottom:11mm;font:${o.fuente};line-height:.92;color:#fff;letter-spacing:${o.ls || "-.15mm"}">${o.frase}</div>
    <div class="abs" style="left:4.6mm;bottom:8.2mm;width:9mm;height:.6mm;background:${o.ac}"></div>
    <div class="abs" style="left:4.6mm;bottom:3.6mm">${marcaNFC("rgba(255,255,255,.85)")}</div></div>`,
  r: () => `<div class="t v" style="background:${o.oscuro}">
    ${foto(o.foto2 || o.foto, o.pos2 || o.pos, "filter:grayscale(.3)")}
    ${capa(`linear-gradient(180deg,${o.oscuro}D9,${o.oscuro}F2 55%,${o.oscuro})`)}
    <div class="abs" style="top:5mm;left:0;right:0;display:flex;justify-content:center">${o.logoMini || o.logo}</div>
    ${blanco("50%", "44mm", o.ac)}
    <div class="abs" style="left:4.6mm;bottom:4.2mm;font:600 1.9mm 'Plus Jakarta Sans';color:rgba(255,255,255,.75);line-height:1.35">${o.pie}<br><span style="opacity:.55">Tecnología LEGION</span></div>
    ${qrc(o.slug, "right:4.2mm;bottom:4.2mm;width:12.5mm;height:12.5mm")}</div>`
});
const img = (src, w, extra = "") => `<img src="${src}" style="width:${w};${extra}">`;

const NEGOCIOS = [
  neg({ slug: "h022", nombre: "Brasa 22 · Restaurante con mesero virtual", foto: F("brasa.jpg"), pos: "50% 40%", foto2: F("carne.jpg"), oscuro: "#120A06", ac: "#F5B942",
    logo: `<div style="text-align:center;color:#fff"><div style="font:400 9mm 'Bebas Neue';letter-spacing:.5mm;line-height:.8">BRASA<span style="color:#F5B942"> 22</span></div><div style="font:800 1.5mm 'Plus Jakarta Sans';letter-spacing:.8mm;color:#F5B942">COCINA URBANA</div></div>`,
    fuente: "800 6.6mm 'Bricolage Grotesque'", frase: `Pide sin<br>esperar al <span style="color:#F5B942">mesero.</span>`, pie: "Carta · Mesero · Cuenta" }),
  neg({ slug: "ghetto", nombre: "Ghetto Barbershop SM", foto: F("ghetto.webp"), pos: "50% 25%", oscuro: "#0B0A08", ac: "#E2C27A",
    logo: img("/datos/logos/ghetto-claro.webp", "22mm", "filter:drop-shadow(0 .8mm 1.4mm rgba(0,0,0,.7))"), logoMini: img("/datos/logos/ghetto-claro.webp", "16mm"),
    fuente: "800 6.4mm 'Cinzel'", ls: ".1mm", frase: `Tu trono<br><span style="color:#E2C27A">te espera.</span>`, pie: "Agenda · Club · @santiiighetto" }),
  neg({ slug: "lookbarber", nombre: "Look Barber · Club de fidelización", foto: F("look.jpg"), pos: "50% 35%", oscuro: "#0D0607", ac: "#E3262F",
    logo: img("/datos/logos/lookbarber.webp", "30mm", "filter:drop-shadow(0 1mm 1.6mm rgba(0,0,0,.8))"), logoMini: img("/datos/logos/lookbarber.webp", "22mm"),
    fuente: "400 8.2mm 'Permanent Marker'", ls: "0", frase: `Club <span style="color:#E3262F">Look</span>`, pie: "10 cortes = 1 gratis" }),
  neg({ slug: "soynatural", nombre: "Soy Natural · Tienda naturista", foto: F("natural.jpg"), pos: "50% 50%", oscuro: "#06200D", ac: "#9BE15D",
    logo: img("/datos/logos/soynatural.webp", "19mm", "filter:drop-shadow(0 1mm 1.6mm rgba(0,0,0,.6))"), logoMini: img("/datos/logos/soynatural.webp", "14mm"),
    fuente: "800 6.6mm 'Bricolage Grotesque'", frase: `Lo natural,<br><span style="color:#9BE15D">a un toque.</span>`, pie: "Tienda · Club · Domicilios" }),
  neg({ slug: "threecaps", nombre: "Three Caps · Streetwear", foto: F("caps.jpg"), pos: "50% 60%", oscuro: "#0A0A0A", ac: "#D9B26F",
    logo: img("/datos/logos/threecaps.webp", "17mm", "border-radius:50%;box-shadow:0 1mm 2mm rgba(0,0,0,.6)"), logoMini: img("/datos/logos/threecaps.webp", "13mm", "border-radius:50%"),
    fuente: "400 10mm 'Bebas Neue'", ls: ".3mm", frase: `The drop<br><span style="color:#D9B26F">is live.</span>`, pie: "Ediciones limitadas" }),
  neg({ slug: "laterraza", nombre: "La Terraza Bar", foto: F("terraza.jpg"), pos: "50% 50%", foto2: F("coctel.jpg"), oscuro: "#0D0814", ac: "#F2B134",
    logo: `<div style="text-align:center;color:#fff"><div style="font:italic 700 6.4mm 'Playfair Display';line-height:1">La Terraza</div><div style="font:800 1.5mm 'Plus Jakarta Sans';letter-spacing:.9mm;color:#F2B134">COCKTAIL BAR</div></div>`,
    fuente: "italic 700 6.6mm 'Playfair Display'", ls: "0", frase: `Tu próximo<br><span style="color:#F2B134">cóctel</span> está aquí.`, pie: "Carta · Wifi · Reservas" }),
  neg({ slug: "lanevada", nombre: "Heladería La Nevada · Catálogo", foto: F("nevada.jpg"), pos: "50% 45%", oscuro: "#2A0A18", ac: "#FF8FB8",
    logo: `<div style="text-align:center;color:#fff"><div style="font:800 6.6mm 'Bricolage Grotesque';letter-spacing:-.2mm;line-height:.9">La Nevada</div><div style="font:800 1.5mm 'Plus Jakarta Sans';letter-spacing:.9mm;color:#FF8FB8">HELADERÍA ARTESANAL</div></div>`,
    fuente: "800 6.8mm 'Bricolage Grotesque'", frase: `Antójate<br><span style="color:#FF8FB8">con fotos.</span>`, pie: "Sabores · Promos · Pedidos" })
];

/* ===== CARPETA VIAL: horizontal, foto de cine ===== */
const vial = (o) => ({
  slug: o.slug, nombre: o.nombre,
  f: () => `<div class="t h" style="background:#000">
    ${foto(o.foto, o.pos, `filter:contrast(1.12) saturate(${o.sat || 1.1}) brightness(.95)`)}
    ${capa(`linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 68%),linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,0) 40%)`)}
    <div class="abs" style="top:4mm;left:4.5mm;font:800 1.6mm 'Plus Jakarta Sans';letter-spacing:.9mm;color:${o.ac}">CARPETA VIAL</div>
    <div class="abs" style="top:7mm;left:4.2mm;font:${o.fuente};line-height:.86;color:#fff;letter-spacing:${o.ls || "0"}">${o.titulo}</div>
    <div class="abs" style="left:4.5mm;bottom:4mm;display:flex;align-items:center;gap:2.4mm">
      <div class="placa" style="padding:.3mm 2.2mm .1mm"><b style="font-size:4mm">${o.placa}</b></div>
      ${marcaNFC("rgba(255,255,255,.85)")}</div></div>`,
  r: () => `<div class="t h" style="background:#000">
    ${foto(o.foto, o.pos2 || o.pos, "filter:grayscale(.5) brightness(.7)")}
    ${capa(`linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.9) 55%)`)}
    ${blanco("21mm", "27mm", o.ac)}
    <div class="abs" style="left:43mm;top:6mm;right:4.5mm;font:${o.fuente2 || o.fuente};font-size:${o.t2 || "5.2mm"};line-height:.92;color:#fff">${o.titulo2 || o.titulo}</div>
    <div class="abs" style="left:43mm;top:${o.y2 || "19mm"};right:4.5mm;font:600 2.05mm 'Plus Jakarta Sans';color:rgba(255,255,255,.8);line-height:1.4">SOAT · Tecno · Licencia<br>Avisos de vencimiento</div>
    ${qrc(o.slug, "left:43mm;bottom:4mm;width:12mm;height:12mm")}
    <div class="abs" style="left:57.5mm;right:4mm;bottom:4mm;font:500 1.45mm 'Plus Jakarta Sans';color:rgba(255,255,255,.5);line-height:1.3">Documentos con PIN. No reemplaza los originales (RUNT).<br><b style="color:rgba(255,255,255,.75);letter-spacing:.3mm">LEGION</b></div></div>`
});

const VIAL = [
  vial({ slug: "vial-demo", nombre: "CARBON · deportivo", foto: F("carbon.jpg"), pos: "60% 55%", ac: "#FF2A2A", placa: "LGN 724",
    fuente: "400 9.6mm 'Russo One'", titulo: `CAR<br>BON`, titulo2: `CARBON`, t2: "6mm", y2: "14mm" }),
  vial({ slug: "vial-demo", nombre: "MONACO · lujo", foto: F("lujo.jpg"), pos: "50% 75%", ac: "#E3C27F", placa: "LGN 724",
    fuente: "800 6.4mm 'Cinzel'", ls: ".5mm", titulo: `MONACO<br><span style="font-size:2.2mm;letter-spacing:1.2mm;color:#E3C27F">PRIVATE COLLECTION</span>`, titulo2: `MONACO`, t2: "5.4mm", y2: "14mm" }),
  vial({ slug: "vial-demo", nombre: "NOCTURNA · noche", foto: F("neon.jpg"), pos: "60% 50%", ac: "#FF3B5C", sat: 1.3, placa: "LGN 724",
    fuente: "900 6.2mm 'Orbitron'", titulo: `NOC<br>TUR<br>NA`, titulo2: `NOCTURNA`, t2: "4.2mm", y2: "13mm" }),
  vial({ slug: "vial-demo", nombre: "ORIGINAL carro (demo)", foto: F("carro.jpg"), pos: "50% 60%", ac: "#F5B942", placa: "LGN 724",
    fuente: "800 6.6mm 'Bricolage Grotesque'", ls: "-.2mm", titulo: `Tus papeles,<br><span style="color:#F5B942">en un toque.</span>`, titulo2: `Todo tu carro<br><span style="color:#F5B942">en un toque</span>`, t2: "4.6mm", y2: "17mm" }),
  vial({ slug: "vial-moto", nombre: "RACING · moto deportiva", foto: F("racing.jpg"), pos: "60% 55%", ac: "#FF2A2A", placa: "LGN 72F",
    fuente: "italic 400 9.2mm 'Russo One'", titulo: `RAC<br>ING`, titulo2: `RACING`, t2: "6mm", y2: "14mm" }),
  vial({ slug: "vial-moto", nombre: "RIDE FREE · street", foto: F("ride.jpg"), pos: "65% 50%", ac: "#FFB000", placa: "LGN 72F",
    fuente: "400 11mm 'Bebas Neue'", ls: ".3mm", titulo: `RIDE<br><span style="color:#FFB000">FREE</span>`, titulo2: `RIDE <span style="color:#FFB000">FREE</span>`, t2: "8mm", y2: "14mm" }),
  vial({ slug: "vial-moto", nombre: "CLÁSICA · café racer", foto: F("clasica.jpg"), pos: "55% 70%", ac: "#E8C88E", sat: .9, placa: "LGN 72F",
    fuente: "italic 700 7.4mm 'Playfair Display'", titulo: `La<br>Clásica`, titulo2: `La Clásica`, t2: "5.6mm", y2: "14mm" }),
  vial({ slug: "vial-moto", nombre: "ORIGINAL moto (demo)", foto: F("moto.jpg"), pos: "50% 55%", ac: "#3EA6FF", placa: "LGN 72F",
    fuente: "800 6.6mm 'Bricolage Grotesque'", ls: "-.2mm", titulo: `Rueda<br><span style="color:#3EA6FF">tranquilo.</span>`, titulo2: `Tu moto<br><span style="color:#3EA6FF">en un toque</span>`, t2: "4.6mm", y2: "17mm" })
];

const L = GRUPO === "vial" ? VIAL : NEGOCIOS;
const solo = P.get("solo");
const sel = solo ? L.filter((_, i) => solo.split(",").includes(String(i + 1))) : L;
document.getElementById("hoja").innerHTML = sel.map((c) => `<div class="par" title="${c.nombre}">${c.f()}${c.r()}</div>`).join("");
document.getElementById("nota").innerHTML = `<b>${GRUPO === "vial" ? "Carpeta Vial (horizontal)" : "Negocios (vertical)"}</b> · ${sel.length} tarjetas, frente y reverso intercalados. ` + sel.map((c, i) => `${i + 1}. ${c.nombre} → legionestudio.com/${c.slug}/`).join(" · ");
document.fonts.ready.then(() => { document.body.dataset.listo = "1"; });
</script>
</body>
</html>
