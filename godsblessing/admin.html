<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0909">
<meta name="robots" content="noindex, nofollow">
<title>Panel · God’s Blessing Barbería</title>
<link rel="icon" href="assets/img/icono-192.png">
<link rel="apple-touch-icon" href="assets/img/icono-192.png">
<link rel="stylesheet" href="assets/gbl.css?v=2">
<style>
  body{min-height:100svh;}
  .shell{max-width:980px;margin:0 auto;padding:0 16px 100px;}
  /* login */
  .login{max-width:380px;margin:0 auto;padding:40px 18px;text-align:center;}
  .login img{width:240px;margin:0 auto 10px;}
  .login h1{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:15px;color:var(--muted);margin-bottom:26px;}
  .who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
  .who button{padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;}
  .who button.on{background:var(--cream);color:#111;border-color:var(--cream);}
  .pin-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 20px;}
  .pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted);}
  .pin-dots i.f{background:var(--cream);border-color:var(--cream);}
  .pin-dots.err{animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto;}
  .pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:26px;}
  .pad button:active{background:var(--surface-2);}
  .login .msg{color:var(--danger);min-height:20px;font-size:14px;margin-top:14px;}

  /* barra superior */
  .bar{position:sticky;top:0;z-index:40;background:rgba(10,9,9,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .bar img{height:34px;}
  .bar .me{font-size:13px;color:var(--muted);text-align:right;}
  .bar .me b{display:block;color:var(--cream);font-size:15px;}
  .bar .me button{background:none;border:0;color:var(--rose);text-decoration:underline;font-size:12px;}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,12,12,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);}
  .tabs button{flex:1;max-width:150px;min-width:0;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .tabs button{font-family:var(--body);font-weight:700;text-transform:none;letter-spacing:.01em;font-size:11.5px;}
  .tabs button svg{width:22px;height:22px;}
  .fab-row .btn,#nuevoM{white-space:normal;line-height:1.2;}
  .tabs button.on{color:var(--cream);}
  .tabs button.on svg{color:var(--rose);}

  h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:24px;margin:22px 0 12px;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .spacer{flex:1;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;}
  .stat b{font-family:var(--display);font-size:26px;}

  /* agenda */
  .datebar{display:flex;align-items:center;gap:8px;margin-top:16px;}
  .datebar .d{flex:1;text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:18px;}
  .icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:18px;}
  .days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;}
  .days::-webkit-scrollbar{display:none;}
  .days button{flex:0 0 auto;width:56px;padding:7px 0;border-radius:12px;border:1px solid var(--line);background:transparent;text-align:center;position:relative;}
  .days small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;}
  .days b{font-family:var(--display);font-size:19px;}
  .days button.on{border-color:var(--rose);background:rgba(201,143,154,.14);}
  .days .n{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red2);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);}
  .seg button.on{background:var(--cream);color:#111;}
  .appt{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;}
  .appt.done{opacity:.6;}
  .appt.off{opacity:.45;}
  .appt .h{font-family:var(--display);font-size:20px;line-height:1.1;}
  .appt .h small{display:block;font-size:12px;color:var(--muted);font-family:var(--body);}
  .appt .c{font-weight:700;font-size:16px;}
  .appt .s{color:var(--muted);font-size:13.5px;}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  .p-pendiente{background:#3a2d12;color:#f0c35a;} .p-confirmado{background:#132a3d;color:#7cc4ff;} .p-completado{background:#123222;color:#5fdc95;}
  .p-cancelado{background:#3a1717;color:#ff8b8b;} .p-no_vino{background:#2c2c2c;color:#bbb;} .p-club{background:#2a1218;color:var(--rose);}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .acts button,.acts a{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:700;}
  .acts .ok{background:var(--cream);color:#111;border-color:var(--cream);}
  .acts .wa{border-color:#1d6b3e;color:#5fdc95;}
  .blk{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px dashed #5a4a2a;color:var(--rose);margin-bottom:10px;font-size:14px;}
  .empty{text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--line);border-radius:14px;}
  .fab-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}

  /* club */
  .scan{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1;max-width:340px;margin:0 auto;}
  .scan video{width:100%;height:100%;object-fit:cover;}
  .scan::after{content:"";position:absolute;inset:18%;border:3px solid var(--cream);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
  .member{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;width:100%;text-align:left;}
  .member .av{flex:0 0 42px;height:42px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--rose);}
  .member .nm{flex:1;min-width:0;}
  .member .nm b{display:block;}
  .member .nm span{color:var(--muted);font-size:12.5px;}
  .mstamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0;}
  .mstamps i{aspect-ratio:1;border-radius:50%;border:2px dashed #555;}
  .mstamps i.f{background:var(--cream);border-color:var(--cream);}
  .big{width:100%;padding:18px;font-size:17px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  td.n,th.n{text-align:right;}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);}
  .list-item:first-child{border-top:0;}
  .list-item span{color:var(--muted);font-size:13px;display:block;}
  .dow{display:flex;gap:6px;flex-wrap:wrap;}
  .dow label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.grid2{grid-template-columns:1fr;}}
  .note{font-size:12.5px;color:var(--muted);margin-top:6px;}
  /* ===== perfiles estilo Netflix ===== */
  .pick{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px 60px;text-align:center;
    background:radial-gradient(700px 420px at 50% 0%,rgba(217,181,90,.12),transparent 70%);}
  .pick .logo{width:200px;margin:0 auto 26px;opacity:.95;}
  .pick h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,38px);letter-spacing:.01em;margin-bottom:30px;}
  .pf-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vw,28px);max-width:820px;}
  .pf{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(96px,26vw,140px);color:var(--muted);transition:color .2s;position:relative;
    animation:pfIn .5s cubic-bezier(.2,.8,.2,1) both;}
  .pf:hover,.pf:focus-visible{color:var(--cream);}
  .pf:hover .pf-av,.pf:focus-visible .pf-av{box-shadow:0 0 0 3px var(--cream);transform:scale(1.04);}
  .pf b{font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pf small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:-6px;}
  .pf .edit{position:absolute;top:0;left:0;right:0;aspect-ratio:1;border-radius:22%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;}
  .pf .edit svg{width:34%;height:34%;color:#fff;}
  @keyframes pfIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  .pf-av{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:22%;width:100%;aspect-ratio:1;
    background:linear-gradient(150deg,var(--c) 0%,color-mix(in srgb,var(--c) 45%,#000) 100%);transition:transform .2s,box-shadow .2s;overflow:hidden;}
  .pf-av::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),transparent 55%);}
  .pf-av svg{width:52%;height:52%;color:#fff;stroke-width:1.6;position:relative;z-index:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));}
  .pf-av.s{width:40px;height:40px;border-radius:11px;} .pf-av.s svg{stroke-width:2;}
  .pf-add .pf-av{background:transparent;border:2px dashed #4a4334;} .pf-add .pf-av::after{display:none;} .pf-add .pf-av svg{color:var(--muted);filter:none;}
  .pf-manage{margin-top:40px;background:transparent;border:1px solid #5d5444;color:var(--muted);padding:11px 26px;font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;}
  .pf-manage:hover,.pf-manage.on{color:var(--cream);border-color:var(--cream);}
  .pf-hint{margin-top:16px;color:var(--muted);font-size:13px;min-height:20px;}
  .pin-screen{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;text-align:center;}
  .pin-screen .pf-av{width:96px;margin-bottom:14px;}
  .pin-screen h2{font-family:var(--display);font-size:22px;margin-bottom:4px;}
  .pin-screen p{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .pad button.go{background:var(--oro);color:#120e07;border-color:transparent;}
  .back{margin-top:22px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;}
  /* selectores de color e ícono */
  .swatches{display:flex;flex-wrap:wrap;gap:10px;}
  .swatches label{cursor:pointer;} .swatches input{position:absolute;opacity:0;pointer-events:none;}
  .swatches span{display:block;width:34px;height:34px;border-radius:10px;border:2px solid transparent;transition:transform .15s;}
  .swatches input:checked+span{border-color:var(--cream);transform:scale(1.1);box-shadow:0 0 0 3px rgba(243,234,215,.15);}
  .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .icons label{cursor:pointer;} .icons input{position:absolute;opacity:0;pointer-events:none;}
  .icons span{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);}
  .icons span svg{width:46%;height:46%;}
  .icons input:checked+span{border-color:var(--gold);background:rgba(217,181,90,.14);color:var(--gold);}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;}
  .toggle small{display:block;color:var(--muted);font-size:12px;}
  .toggle input{width:20px;height:20px;accent-color:var(--gold);flex:0 0 auto;}
  .me-card{display:flex;align-items:center;gap:14px;}
  .me-card .pf-av{width:64px;}
  .bar .who-me{display:flex;align-items:center;gap:10px;}
  .bar .who-me .pf-av{width:34px;border-radius:9px;}
  /* club */
  .alerta{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(217,181,90,.45);background:rgba(217,181,90,.08);margin:12px 0;font-size:14px;}
  .alerta svg{width:22px;height:22px;color:var(--gold);flex:0 0 auto;}
  .rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;}
  .rank:first-child{border-top:0;}
  .rank .pos{font-family:var(--display);font-size:18px;width:26px;color:var(--gold);}
  .rank .nm{flex:1;min-width:0;} .rank .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .rank .nm span{color:var(--muted);font-size:12.5px;}
  .feed{list-style:none;} .feed li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;} .feed li:first-child{border-top:0;}
  .feed .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:0 0 auto;}
  .feed span{color:var(--muted);font-size:12px;display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .chips span{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);}
  .chips b{color:var(--cream);}
  .hist{max-height:180px;overflow:auto;margin-top:8px;border-top:1px solid var(--line);}
  .hist div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .hist div span{color:var(--muted);font-size:12px;white-space:nowrap;}
  .tj{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;} .tj:first-child{border-top:0;}
  .tj code{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--gold);}
  .club-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  @media (max-width:640px){.club-grid{grid-template-columns:1fr;}}
  .card h3{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
  /* página: catálogo, promos y galería */
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .cat{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;transition:border-color .2s,transform .2s;}
  .cat:hover{border-color:var(--gold);transform:translateY(-2px);}
  .cat-img{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;background:var(--surface-2) center/cover no-repeat;color:var(--muted);font-size:13px;}
  .cat-img i{position:absolute;top:8px;left:8px;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:999px;}
  .cat-img svg{width:34px;height:34px;}
  .cat-tx{padding:12px 14px 14px;} .cat-tx b{display:block;font-size:15px;} .cat-tx span{color:var(--muted);font-size:13px;}
  .cat-tx s{margin-left:4px;}
  .cat-add{border-style:dashed;background:transparent;} .cat-add .cat-img{background:transparent;}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
  .gal-it{position:relative;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:flex;align-items:flex-end;padding:0;overflow:hidden;cursor:pointer;}
  .gal-it span{width:100%;padding:18px 8px 7px;font-size:12px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.8));}
  .gal-add{flex-direction:column;align-items:center;justify-content:center;border-style:dashed;color:var(--muted);gap:6px;}
  .gal-add svg{width:30px;height:30px;} .gal-add span{background:none;padding:0;text-align:center;}
  .foto-edit{aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}
  .field textarea{resize:vertical;}
</style>
</head>

<div id="root"><div style="text-align:center;padding:90px 0"><span class="spin"></span></div></div>

<script src="assets/gbl.js?v=2"></script>

<script>
const { rpc, esc, money, toMin, fromMin, time12, addDays, parseDate, dateLong, dateShort, telFmt, waLink, modal, alertBox, confirmBox, toast } = GB;
const TK = 'gbl_panel_token';
const root = document.getElementById('root');
let INFO = null, ME = null, TOKEN = localStorage.getItem(TK), TAB = 'agenda';
if (['agenda', 'club', 'pagina', 'numeros', 'ajustes'].includes(location.hash.slice(1))) TAB = location.hash.slice(1);   // enlace directo a una pestaña
let fecha = null, filtroBarbero = null, refreshTimer = null;

const ICON = {
  agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  club: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="9" cy="12.5" r="2.2"/><path d="M14 11h4M14 14h3"/></svg>',
  numeros: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  pagina: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',

}

const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONOS = {

function vistaPin(b) {
  let pin = '';
  root.innerHTML = `<div class="pin-screen">${avatar(b)}<h2>${esc(b.nombre)}</h2><p>${gestionar ? 'PIN de administrador' : 'Escribe tu PIN'}</p>
    <div class="pin-dots" id="dots" aria-label="PIN"></div>
    <div class="pad" id="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="del" aria-label="Borrar">⌫</button><button type="button" data-k="0">0</button><button type="button" class="go" data-k="ok" aria-label="Entrar">→</button></div>
    <div class="login"><div class="msg" id="m" role="alert" style="margin:0"></div></div>
    <button type="button" class="back" id="volver">Volver a los perfiles</button></div>`;
  const dots = document.getElementById('dots'), m = document.getElementById('m');
  const paint = () => { const n = Math.max(3, pin.length); dots.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join(''); };
  paint();
  async function go() {
    if (pin.length < 3) { m.textContent = 'El PIN tiene mínimo 3 números.'; return; }
    try {
      const r = await rpc('gbl_login', { p_barbero: b.id, p_pin: pin });
      TOKEN = r.token; localStorage.setItem(TK, TOKEN); ME = r;
      if (gestionar) { gestionar = false; if (r.es_dueno) TAB = 'ajustes'; else toast('Ese perfil no es administrador: no puede editar perfiles.'); }
      arrancar();
    } catch (e) { m.textContent = e.message; pin = ''; paint(); dots.classList.remove('err'); void dots.offsetWidth; dots.classList.add('err'); }
  }
  function key(k) {
    if (k === 'del') pin = pin.slice(0, -1);
    else if (k === 'ok') return go();
    else if (pin.length < 6) pin += k;
    m.textContent = ''; paint();
  }
  document.getElementById('pad').onclick = (e) => { const x = e.target.closest('button'); if (x) key(x.dataset.k); };
  document.getElementById('volver').onclick = () => vistaLogin();
  document.onkeydown = (e) => { if (!document.getElementById('pad')) return; if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('del'); else if (e.key === 'Enter') key('ok'); else if (e.key === 'Escape') vistaLogin(); };
}

async function cargarAgenda(silent) {
  let d;
  try { d = await call('gbl_admin_agenda', { p_fecha: fecha, p_barbero: filtroBarbero }); }
  catch (e) { if (!silent) document.getElementById('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (TAB !== 'agenda') return;
  document.getElementById('dTxt').textContent = fecha === INFO.hoy ? 'Hoy · ' + dateShort(fecha) : dateLong(fecha);
  const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const days = document.getElementById('days');
  days.innerHTML = Array.from({ length: 15 }, (_, i) => {
    const s = addDays(INFO.hoy, i - 1), dt = parseDate(s), n = d.pendientes_dias[s];
    return `<button type="button" data-d="${s}" class="${s === fecha ? 'on' : ''}"><small>${s === INFO.hoy ? 'Hoy' : DOW[dt.getDay()]}</small><b>${dt.getDate()}</b>${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
  days.onclick = (e) => { const b = e.target.closest('button'); if (b) { fecha = b.dataset.d; cargarAgenda(); } };
  const on = days.querySelector('.on'); if (on && !silent) on.scrollIntoView({ inline: 'center', block: 'nearest' });

  const activos = d.turnos.filter((t) => t.estado !== 'cancelado' && t.estado !== 'no_vino');
  const hechos = d.turnos.filter((t) => t.estado === 'completado');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><small>Turnos</small><b>${activos.length}</b></div>
    <div class="stat"><small>Por atender</small><b>${activos.length - hechos.length}</b></div>
    <div class="stat"><small>Atendidos</small><b>${hechos.length}</b></div>
    <div class="stat"><small>Recaudado</small><b>${money(hechos.reduce((a, t) => a + (t.valor || 0), 0))}</b></div>`;

  const list = document.getElementById('list');
  if (!d.turnos.length && !d.bloqueos.length) { list.innerHTML = '<div class="empty">No hay turnos este día.</div>'; return; }
  const showB = ME.es_dueno && INFO.barberos.length > 1 && !filtroBarbero;
  list.innerHTML = d.bloqueos.map((b) => `<div class="blk"><span>${b.ini ? `${time12(b.ini)} – ${time12(b.fin)}` : 'Todo el día'} · ${esc(b.motivo || 'Bloqueado')}${showB ? ' · ' + esc(b.barbero) : ''}</span>
      <button type="button" class="linkbtn" data-unb="${b.id}" style="background:none;border:0;color:var(--rose);text-decoration:underline;font-weight:700">Quitar</button></div>`).join('')
    + d.turnos.map((t) => {
      const fin = fromMin(toMin(t.hora) + t.duracion);
      const cls = t.estado === 'completado' ? 'done' : (t.estado === 'cancelado' || t.estado === 'no_vino') ? 'off' : '';
      const recordar = `Hola ${t.cliente.split(' ')[0]}! Te recordamos tu turno en God’s Blessing ${fecha === INFO.hoy ? 'hoy' : dateLong(fecha)} a las ${time12(t.hora)} (${t.servicio}). Te esperamos.`;
      let acts = '';
      if (t.estado === 'pendiente') acts += `<button class="ok" data-a="confirmado">Confirmar</button>`;
      if (t.estado === 'pendiente' || t.estado === 'confirmado') acts += `<button class="ok" data-a="completado">Atendido</button><button data-a="no_vino">No vino</button><button data-a="cancelado">Cancelar</button>`;
      if (t.estado === 'cancelado' || t.estado === 'no_vino') acts += `<button data-a="confirmado">Reactivar</button>`;
      acts += `<a class="wa" href="${waLink(t.tel, recordar)}" target="_blank" rel="noopener">WhatsApp</a>`;
      return `<div class="appt ${cls}" data-id="${t.id}"><div class="h">${time12(t.hora).replace(' ', '<small>')}</small><small>hasta ${time12(fin)}</small></div>
        <div><div class="c">${esc(t.cliente)}<span class="pill p-${t.estado}">${ESTADO[t.estado]}</span>${t.club ? `<span class="pill p-club">Club ${t.club.sellos}</span>` : ''}</div>
        <div class="s">${esc(t.servicio)}${t.valor != null ? ' · ' + money(t.valor) : t.precio != null ? ' · ' + money(t.precio) : ''}${showB ? ' · ' + esc(t.barbero) : ''} · ${telFmt(t.tel)}${t.origen === 'web' ? ' · reservó en la página' : ''}</div>
        <div class="acts">${acts}</div></div></div>`;
    }).join('');
  list.querySelectorAll('[data-unb]').forEach((b) => b.onclick = async () => {
    try { await call('gbl_admin_desbloquear', { p_id: b.dataset.unb }); toast('Horario liberado'); cargarAgenda(); } catch (e) { alertBox(esc(e.message)); }
  });
  list.querySelectorAll('.appt').forEach((el) => el.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => cambiarEstado(d.turnos.find((t) => t.id === el.dataset.id), b.dataset.a)));
}

async function cambiarEstado(t, estado) {
  let valor = null;
  if (estado === 'completado') {
    const r = await modal(`<h3>¿Cuánto pagó?</h3><p class="muted">${esc(t.cliente)} · ${esc(t.servicio)}</p>
      <div class="field" style="margin-top:14px"><label for="val">Valor</label><input id="val" type="number" inputmode="numeric" min="0" step="1000" value="${t.precio != null ? t.precio : ''}" placeholder="Ej: 25000"></div>`,
      [{ label: 'Cancelar', value: false }, { label: 'Guardar', value: true, primary: true }]);
    if (!r) return;
    const raw = document.getElementById('val') ? document.getElementById('val').value : '';
    valor = raw === '' ? null : Math.max(0, parseInt(raw, 10) || 0);
  } else if (estado === 'cancelado' || estado === 'no_vino') {
    if (!(await confirmBox(`¿Marcar el turno de <b>${esc(t.cliente)}</b> como <b>${ESTADO[estado].toLowerCase()}</b>? La hora queda libre.`, 'Sí', 'No', true))) return;
  }
  try {
    const r = await call('gbl_admin_estado', { p_id: t.id, p_estado: estado, p_valor: valor });
    if (r.club) {
      const c = r.club;
      toast(c.ok ? `Sello puesto: ${c.sellos} de ${c.meta}${c.lleno ? ' · ¡tarjeta llena!' : ''}` : `Club: ${c.motivo}`);
    } else toast(ESTADO[estado]);
    cargarAgenda();
  } catch (e) { alertBox(esc(e.message)); }
}

async function escanear() {
  const box = document.getElementById('scanBox');
  if (scanStream) { stopScan(); box.innerHTML = ''; return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (e) { box.innerHTML = '<p class="note" style="margin-top:12px">No se pudo abrir la cámara. Revisa el permiso del navegador o escribe el código.</p>'; return; }
  box.innerHTML = '<div class="scan" style="margin-top:14px"><video id="sv" playsinline muted></video></div><p class="note" style="text-align:center">Apunta al QR de la tarjeta del cliente.</p>';
  const video = document.getElementById('sv'); video.srcObject = scanStream; await video.play();
  const det = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;   // iPhone: jsQR
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const leer = async () => {
    if (det) { const c = await det.detect(video); return c.length ? c[0].rawValue : null; }
    if (!video.videoWidth || typeof jsQR !== 'function') return null;
    const w = 480, h = Math.round(480 * video.videoHeight / video.videoWidth); cv.width = w; cv.height = h;
    cx.drawImage(video, 0, 0, w, h); const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h); return r ? r.data : null;
  };
  const tick = async () => {
    if (!scanStream) return;
    try {
      const raw = await leer();
      if (raw) {
        let c = raw;
        try { const u = new URL(raw); c = u.searchParams.get('t') || u.searchParams.get('c') || raw; } catch (e) {}
        stopScan(); box.innerHTML = '';
        document.getElementById('q').value = c.toUpperCase(); buscar(c);
        return;
      }
    } catch (e) {}
    scanLoop = requestAnimationFrame(tick);
  };
  tick();
}

// Las fotos se achican en el celular antes de subirlas (máx. 1100 px, WebP) para que la página cargue rápido.
function leerFoto(file, max = 1100) {
  return new Promise((ok, mal) => {
    if (!file) return ok(null);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.8, d = c.toDataURL('image/webp', q);
      if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', q);
      while (d.length > 420000 && q > 0.4) { q -= 0.1; d = c.toDataURL(d.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg', q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer esa imagen.')); };
    img.src = url;
  });
}

function conectarFoto(id = 'fFoto') {

async function vistaPagina() {
  const v = view();
  v.innerHTML = '<div class="empty" style="margin-top:20px"><span class="spin"></span></div>';
  let d; try { d = await call('gbl_admin_catalogo'); } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const c = d.config || {};
  const tarjeta = (x, tipo) => `<button type="button" class="cat" data-${tipo}="${x.id}">
      <span class="cat-img" style="${x.foto ? `background-image:url('${esc(x.foto)}')` : ''}">${x.foto ? '' : 'Sin foto'}${x.activo === false ? '<i>Oculto</i>' : ''}</span>
      <span class="cat-tx"><b>${esc(x.nombre || x.titulo)}</b><span>${precioTxt(x.precio, x.precio_antes)}${x.duracion ? ` · ${x.duracion} min` : ''}${x.etiqueta ? ` · ${esc(x.etiqueta)}` : ''}${x.vence ? ` · hasta ${dateShort(x.vence)}` : ''}</span></span></button>`;
  v.innerHTML = `<p class="note" style="margin-top:18px">Todo lo que cambies aquí se ve de una vez en la página de la barbería. <a href="./" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:underline">Ver la página</a></p>
    <h2 class="sec">Promociones</h2>
    <div class="cats">${d.promos.map((p) => tarjeta(p, 'pr')).join('')}<button type="button" class="cat cat-add" id="addPr"><span class="cat-img">${PLUS}</span><span class="cat-tx"><b>Nueva promoción</b><span>Con foto, precio y fecha</span></span></button></div>
    <h2 class="sec">Servicios y precios</h2>
    <div class="cats">${d.servicios.map((s) => tarjeta(s, 'sv')).join('')}<button type="button" class="cat cat-add" id="addSv"><span class="cat-img">${PLUS}</span><span class="cat-tx"><b>Nuevo servicio</b><span>Aparece en la carta y en reservas</span></span></button></div>
    <h2 class="sec">Galería de fotos</h2>
    <div class="gal">${d.galeria.map((g) => `<button type="button" class="gal-it" data-ga="${g.id}" style="background-image:url('${esc(g.foto)}')"><span>${esc(g.titulo || '')}</span></button>`).join('')}
      <label class="gal-it gal-add" title="Agregar fotos">${PLUS}<span>Agregar fotos</span><input type="file" accept="image/*" multiple id="addGa" hidden></label></div>
    <h2 class="sec">Textos de la página</h2>
    <form class="card" id="fTx">
      <div class="field"><label for="t_tit">Frase principal (sección "La casa")</label><input id="t_tit" maxlength="80" value="${esc(c.casa_titulo || '')}"></div>
      <div class="field"><label for="t_txt">Texto</label><textarea id="t_txt" rows="4" maxlength="400">${esc(c.casa_texto || '')}</textarea></div>
      <div class="grid2"><div class="field"><label for="t_meta">Sellos para el premio del Club</label><input id="t_meta" type="number" min="3" max="12" value="${esc(c.meta_sellos)}"></div>
      <div class="field"><label for="t_pre">Premio del Club</label><input id="t_pre" value="${esc(c.premio || '')}" maxlength="40"></div></div>
      <div class="field"><label for="t_pag">Métodos de pago</label><input id="t_pag" value="${esc(c.pagos || '')}" maxlength="200"></div>
      <button class="btn btn-cream btn-sm">Guardar textos</button>
    </form>`;

  const recargar = async (msg) => { INFO = await rpc('gbl_info'); loadedAt = Date.now(); toast(msg); vistaPagina(); };

  const editarServicio = async (s) => {
    const nuevo = !s; s = s || { nombre: '', descripcion: '', precio: null, precio_antes: null, duracion: 40, destacado: false, activo: true, foto: null };
    const p = modal(`<h3>${nuevo ? 'Nuevo servicio' : 'Editar servicio'}</h3>
      ${campoFoto(s.foto)}
      <div class="field"><label for="es_n">Nombre</label><input id="es_n" value="${esc(s.nombre)}" maxlength="40"></div>
      <div class="field"><label for="es_d">Descripción corta</label><input id="es_d" value="${esc(s.descripcion)}" maxlength="90"></div>
      <div class="grid2"><div class="field"><label for="es_p">Precio (vacío = se cotiza)</label><input id="es_p" type="number" inputmode="numeric" min="0" step="1000" value="${s.precio ?? ''}"></div>
      <div class="field"><label for="es_a2">Precio antes (para mostrar descuento)</label><input id="es_a2" type="number" inputmode="numeric" min="0" step="1000" value="${s.precio_antes ?? ''}" placeholder="Opcional"></div></div>
      <div class="field"><label for="es_t">Duración (min)</label><input id="es_t" type="number" min="10" max="240" step="5" value="${s.duracion}"></div>
      <label class="toggle"><span>Destacado<small>Sale con la etiqueta Signature</small></span><input type="checkbox" id="es_x" ${s.destacado ? 'checked' : ''}></label>
      <label class="toggle"><span>Visible en la página<small>Si lo apagas, no se puede reservar</small></span><input type="checkbox" id="es_v" ${s.activo ? 'checked' : ''}></label>`,
      [{ label: 'Cancelar', value: false }, ...(nuevo ? [] : [{ label: 'Eliminar', value: 'del', cls: 'btn-ghost' }]), { label: 'Guardar', value: true, primary: true }]);
    const foto = conectarFoto();
    const r = await p; if (!r) return;
    try {
      if (r === 'del') {
        if (!(await confirmBox(`¿Eliminar <b>${esc(s.nombre)}</b>? Si ya tiene turnos, solo se oculta de la página.`, 'Eliminar', 'Cancelar', true))) return;
        const x = await call('gbl_admin_eliminar_servicio', { p_id: s.id }); return recargar(x.oculto ? 'Tenía turnos: quedó oculto' : 'Servicio eliminado');
      }
      const g = (id) => document.getElementById(id);
      await call('gbl_admin_guardar_servicio', { p_id: s.id || null, p_nombre: g('es_n').value, p_descripcion: g('es_d').value, p_precio: numOrNull(g('es_p').value),
        p_duracion: parseInt(g('es_t').value, 10), p_destacado: g('es_x').checked, p_activo: g('es_v').checked, p_orden: s.orden ?? null,
        p_foto: foto.valor, p_precio_antes: numOrNull(g('es_a2').value) });
      recargar('Servicio guardado');
    } catch (e) { alertBox(esc(e.message)); }
  };

  const editarPromo = async (pr) => {
    const nuevo = !pr; pr = pr || { titulo: '', descripcion: '', precio: null, precio_antes: null, etiqueta: '', vence: null, foto: null, activo: true };
    const p = modal(`<h3>${nuevo ? 'Nueva promoción' : 'Editar promoción'}</h3>
      ${campoFoto(pr.foto)}
      <div class="field"><label for="ep_t">Título</label><input id="ep_t" value="${esc(pr.titulo)}" maxlength="50" placeholder="Martes de barba"></div>
      <div class="field"><label for="ep_d">Descripción</label><input id="ep_d" value="${esc(pr.descripcion)}" maxlength="160"></div>
      <div class="grid2"><div class="field"><label for="ep_p">Precio promo</label><input id="ep_p" type="number" inputmode="numeric" min="0" step="1000" value="${pr.precio ?? ''}"></div>
      <div class="field"><label for="ep_a">Precio normal (tachado)</label><input id="ep_a" type="number" inputmode="numeric" min="0" step="1000" value="${pr.precio_antes ?? ''}" placeholder="Opcional"></div></div>
      <div class="grid2"><div class="field"><label for="ep_e">Etiqueta</label><input id="ep_e" value="${esc(pr.etiqueta)}" maxlength="24" placeholder="Solo martes, Combo…"></div>
      <div class="field"><label for="ep_v">Válida hasta (opcional)</label><input id="ep_v" type="date" value="${pr.vence || ''}"></div></div>
      <label class="toggle"><span>Activa<small>Se muestra en la página. Si tiene fecha, se oculta sola al vencer.</small></span><input type="checkbox" id="ep_on" ${pr.activo ? 'checked' : ''}></label>`,
      [{ label: 'Cancelar', value: false }, ...(nuevo ? [] : [{ label: 'Eliminar', value: 'del', cls: 'btn-ghost' }]), { label: 'Guardar', value: true, primary: true }]);
    const foto = conectarFoto();
    const r = await p; if (!r) return;
    try {
      if (r === 'del') {
        if (!(await confirmBox(`¿Eliminar la promoción <b>${esc(pr.titulo)}</b>?`, 'Eliminar', 'Cancelar', true))) return;
        await call('gbl_admin_eliminar_promo', { p_id: pr.id }); return recargar('Promoción eliminada');
      }
      const g = (id) => document.getElementById(id);
      await call('gbl_admin_guardar_promo', { p_id: pr.id || null, p_titulo: g('ep_t').value, p_descripcion: g('ep_d').value, p_precio: numOrNull(g('ep_p').value),
        p_precio_antes: numOrNull(g('ep_a').value), p_etiqueta: g('ep_e').value, p_vence: g('ep_v').value || null, p_foto: foto.valor, p_activo: g('ep_on').checked, p_orden: pr.orden ?? null });
      recargar('Promoción guardada');
    } catch (e) { alertBox(esc(e.message)); }
  };

  const editarFoto = async (gf) => {
    const p = modal(`<h3>Foto de la galería</h3><div class="foto-edit" style="background-image:url('${esc(gf.foto)}')"></div>
      <div class="field" style="margin-top:12px"><label for="eg_t">Texto debajo de la foto</label><input id="eg_t" value="${esc(gf.titulo)}" maxlength="40"></div>
      <div class="field"><label for="eg_o">Posición (1 = primera)</label><input id="eg_o" type="number" min="1" max="16" value="${d.galeria.indexOf(gf) + 1}"></div>`,
      [{ label: 'Cancelar', value: false }, { label: 'Eliminar', value: 'del', cls: 'btn-ghost' }, { label: 'Guardar', value: true, primary: true }]);
    const r = await p; if (!r) return;
    try {
      if (r === 'del') { await call('gbl_admin_eliminar_foto', { p_id: gf.id }); return recargar('Foto eliminada'); }
      // Reordena: la foto toma la posición pedida y las demás se corren.
      const pos = Math.max(1, Math.min(d.galeria.length, parseInt(document.getElementById('eg_o').value, 10) || 1));
      const lista = d.galeria.filter((x) => x.id !== gf.id); lista.splice(pos - 1, 0, gf);
      for (let i = 0; i < lista.length; i++) {
        const x = lista[i];
        await call('gbl_admin_guardar_foto', { p_id: x.id, p_foto: null, p_titulo: x.id === gf.id ? document.getElementById('eg_t').value : x.titulo, p_orden: i + 1 });
      }
      recargar('Galería actualizada');
    } catch (e) { alertBox(esc(e.message)); }
  };

  document.getElementById('addSv').onclick = () => editarServicio(null);
  document.getElementById('addPr').onclick = () => editarPromo(null);
  v.querySelectorAll('[data-sv]').forEach((b) => b.onclick = () => editarServicio(d.servicios.find((x) => x.id === b.dataset.sv)));
  v.querySelectorAll('[data-pr]').forEach((b) => b.onclick = () => editarPromo(d.promos.find((x) => x.id === b.dataset.pr)));
  v.querySelectorAll('[data-ga]').forEach((b) => b.onclick = () => editarFoto(d.galeria.find((x) => x.id === b.dataset.ga)));
  document.getElementById('addGa').onchange = async (e) => {
    const files = [...e.target.files]; if (!files.length) return;
    toast(`Subiendo ${files.length} ${files.length === 1 ? 'foto' : 'fotos'}…`);
    try { for (const f of files) await call('gbl_admin_guardar_foto', { p_id: null, p_foto: await leerFoto(f), p_titulo: '', p_orden: null }); recargar('Fotos agregadas'); }
    catch (err) { alertBox(esc(err.message)); vistaPagina(); }
  };
  document.getElementById('fTx').onsubmit = async (e) => {
    e.preventDefault();
    const g = (id) => document.getElementById(id).value.trim();
    try {
      await call('gbl_admin_config', { p_cambios: { casa_titulo: g('t_tit'), casa_texto: g('t_txt'), meta_sellos: Math.max(3, Math.min(12, Number(g('t_meta')) || 5)), premio: g('t_pre') || 'Corte gratis', pagos: g('t_pag') } });
      recargar('Textos guardados');
    } catch (err) { alertBox(esc(err.message)); }
  };
}

/* ================= AJUSTES: mi perfil, perfiles (admin) y negocio ================= */
async function vistaAjustes() {
  const v = view();
  v.innerHTML = '<div class="empty" style="margin-top:20px"><span class="spin"></span></div>';
  let d = null;
  if (ME.es_dueno) { try { d = await call('gbl_admin_datos'); } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; } }
  const c = d ? d.config : {}, cerr = (c.dias_cerrados || []).map(String);
  const DOW = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  v.innerHTML = `
    <h2 class="sec">Mi perfil</h2>
    <div class="card"><div class="me-card">${avatar(ME)}<div style="flex:1;min-width:0"><b style="font-size:17px">${esc(ME.nombre)}</b>
      <p class="muted" style="font-size:13px">${ME.es_dueno ? 'Administrador' : 'Barbero'}${ME.especialidad ? ' · ' + esc(ME.especialidad) : ''}</p></div></div>
      <div class="row" style="margin-top:14px"><button class="btn btn-ghost btn-sm" id="miPerfil">Editar mi perfil</button><button class="btn btn-cream btn-sm" id="miPin">Cambiar mi PIN</button></div></div>
    ${d ? `
    ${d.ejemplos ? `<div class="card" style="margin-top:18px;border-color:#5a4a2a"><b>Hay ${d.ejemplos} datos de ejemplo</b> (turnos y miembros del Club).
      <button class="btn btn-red btn-sm" id="delEj" style="margin-top:10px">Borrar datos de ejemplo</button></div>` : ''}
    <h2 class="sec">Perfiles</h2>
    <p class="note" style="margin-top:-6px;margin-bottom:14px">Cada barbero entra con su perfil y su PIN. Los administradores pueden manejar perfiles, la página y los números.</p>
    <div class="pf-grid" style="justify-content:flex-start">${d.barberos.map((b) => `<button type="button" class="pf" data-eb="${b.id}" style="width:110px;color:var(--cream)">${avatar(b)}<span class="edit">${LAPIZ}</span><b>${esc(b.nombre)}</b>${b.es_dueno ? '<small>Admin</small>' : ''}${b.activo ? '' : '<small style="color:var(--muted)">Pausado</small>'}</button>`).join('')}
      ${d.barberos.length < 12 ? `<button type="button" class="pf pf-add" id="addBar" style="width:110px"><span class="pf-av">${PLUS}</span><b>Agregar perfil</b></button>` : ''}</div>
    <h2 class="sec">Negocio</h2>
    <form class="card" id="fCfg">
      <div class="grid2"><div class="field"><label for="c_abre">Abre</label><input id="c_abre" type="time" value="${esc(c.hora_abre)}"></div><div class="field"><label for="c_cierra">Cierra</label><input id="c_cierra" type="time" value="${esc(c.hora_cierra)}"></div></div>
      <div class="field"><label>Días que NO abren</label><div class="dow">${DOW.map((n, i) => `<label><input type="checkbox" value="${i}" ${cerr.includes(String(i)) ? 'checked' : ''}> ${n}</label>`).join('')}</div></div>
      <div class="field"><label for="c_ht">Horario como se muestra en la página</label><input id="c_ht" value="${esc(c.horario_texto || '')}" maxlength="80"></div>
      <div class="grid2"><div class="field"><label for="c_wa">WhatsApp del negocio</label><input id="c_wa" type="tel" inputmode="numeric" value="${esc(c.whatsapp || '')}" placeholder="3001234567"></div>
      <div class="field"><label for="c_ig">Instagram</label><input id="c_ig" value="${esc(c.instagram || '')}" placeholder="usuario sin @"></div></div>
      <div class="field"><label for="c_dir">Dirección</label><input id="c_dir" value="${esc(c.direccion || '')}" maxlength="120"></div>
      <div class="field"><label for="c_map">Enlace de Google Maps (opcional)</label><input id="c_map" value="${esc(c.mapa || '')}" placeholder="https://maps.app.goo.gl/…"></div>
      <div class="grid2"><div class="field"><label for="c_int">Turnos cada (minutos)</label><select id="c_int">${[15, 20, 30, 40, 60].map((n) => `<option ${Number(c.intervalo) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label for="c_adel">Se puede reservar con (días)</label><input id="c_adel" type="number" min="1" max="60" value="${esc(c.dias_adelante)}"></div></div>
      <div class="field"><label for="c_res">Enlace para dejar reseña en Google</label><input id="c_res" value="${esc(c.resena || '')}" placeholder="https://g.page/r/…/review"></div>
      <button class="btn btn-cream btn-sm">Guardar cambios</button>
      <p class="note">Precios, promociones, fotos y textos se cambian en la pestaña Página.</p>
    </form>` : ''}`;

  document.getElementById('miPerfil').onclick = async () => {
    const p = modal(`<h3>Mi perfil</h3>
      <div class="field" style="margin-top:12px"><label for="mp_n">Nombre</label><input id="mp_n" value="${esc(ME.nombre)}" maxlength="30"></div>
      <div class="field"><label for="mp_e">Especialidad</label><input id="mp_e" value="${esc(ME.especialidad || '')}" maxlength="60" placeholder="Fades, diseños…"></div>
      <div class="field"><label>Color</label>${colorPicker(ME.color)}</div><div class="field"><label>Ícono</label>${iconPicker(ME.icono)}</div>`,
      [{ label: 'Cancelar', value: false }, { label: 'Guardar', value: true, primary: true }]);
    if (!(await p)) return;
    try {
      const r = await call('gbl_mi_perfil', { p_nombre: document.getElementById('mp_n').value, p_especialidad: document.getElementById('mp_e').value, p_color: radio('pcol') || ME.color, p_icono: radio('pico') || ME.icono });
      ME = Object.assign(ME, r); INFO = await rpc('gbl_info'); toast('Perfil actualizado'); TAB = 'ajustes'; arrancar();
    } catch (e) { alertBox(esc(e.message)); }
  };
  document.getElementById('miPin').onclick = async () => {
    const p = modal(`<h3>Cambiar mi PIN</h3><p class="muted">De 3 a 6 números. Es solo tuyo: no lo compartas.</p>
      <div class="field" style="margin-top:12px"><label for="pn_a">PIN actual</label><input id="pn_a" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="field"><label for="pn_n">PIN nuevo</label><input id="pn_n" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="field"><label for="pn_c">Repite el PIN nuevo</label><input id="pn_c" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>`,
      [{ label: 'Cancelar', value: false }, { label: 'Cambiar PIN', value: true, primary: true }]);
    if (!(await p)) return;
    const g = (id) => document.getElementById(id).value.trim();
    if (g('pn_n') !== g('pn_c')) { alertBox('Los dos PIN nuevos no coinciden.'); return; }
    try { await call('gbl_mi_pin', { p_actual: g('pn_a'), p_nuevo: g('pn_n') }); alertBox('<h3>PIN cambiado</h3>Desde ahora entras con tu PIN nuevo.'); } catch (e) { alertBox(esc(e.message)); }
  };
  if (!d) return;

  if (d.ejemplos) document.getElementById('delEj').onclick = async () => {
    if (!(await confirmBox('Se borran los turnos y miembros de ejemplo. Lo real no se toca.', 'Borrar', 'Cancelar', true))) return;
    try { await call('gbl_admin_borrar_ejemplos'); toast('Datos de ejemplo borrados'); vistaAjustes(); } catch (e) { alertBox(esc(e.message)); }
  };
  document.getElementById('fCfg').onsubmit = async (e) => {
    e.preventDefault();
    const g = (id) => document.getElementById(id).value.trim();
    const cambios = {
      hora_abre: g('c_abre'), hora_cierra: g('c_cierra'), horario_texto: g('c_ht'), whatsapp: g('c_wa').replace(/\D/g, ''),
      instagram: g('c_ig').replace('@', ''), direccion: g('c_dir'), mapa: g('c_map'), intervalo: Number(g('c_int')),
      dias_adelante: Math.max(1, Math.min(60, Number(g('c_adel')) || 21)), resena: g('c_res'),
      dias_cerrados: [...document.querySelectorAll('.dow input:checked')].map((x) => x.value)
    };
    if (cambios.hora_cierra <= cambios.hora_abre) { alertBox('La hora de cierre debe ser después de la de apertura.'); return; }
    try { await call('gbl_admin_config', { p_cambios: cambios }); INFO = await rpc('gbl_info'); loadedAt = Date.now(); toast('Guardado'); } catch (err) { alertBox(esc(err.message)); }
  };

  const editarBarbero = async (b) => {
    const nuevo = !b, yo = b && b.id === ME.id;
    b = b || { nombre: `Barbero ${d.barberos.length + 1}`, especialidad: '', activo: true, es_dueno: false, color: COLORES[d.barberos.length % COLORES.length], icono: Object.keys(ICONOS)[d.barberos.length % 8] };
    const p = modal(`<h3>${nuevo ? 'Nuevo perfil' : 'Editar perfil'}</h3>
      <div class="field" style="margin-top:12px"><label for="eb_n">Nombre</label><input id="eb_n" value="${esc(b.nombre)}" maxlength="30"></div>
      <div class="field"><label for="eb_e">Especialidad</label><input id="eb_e" value="${esc(b.especialidad)}" maxlength="60" placeholder="Fades, diseños…"></div>
      <div class="field"><label>Color</label>${colorPicker(b.color)}</div>
      <div class="field"><label>Ícono</label>${iconPicker(b.icono)}</div>
      <div class="field"><label for="eb_p">PIN ${nuevo ? '(3 a 6 números)' : '(vacío = no cambiarlo)'}</label><input id="eb_p" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <label class="toggle"><span>Administrador<small>Maneja perfiles, la página, los números y el Club completo</small></span><input type="checkbox" id="eb_d" ${b.es_dueno ? 'checked' : ''} ${yo ? 'disabled' : ''}></label>
      <label class="toggle"><span>Activo<small>Si lo pausas, no puede entrar ni recibir reservas</small></span><input type="checkbox" id="eb_a" ${b.activo ? 'checked' : ''} ${yo ? 'disabled' : ''}></label>`,
      [{ label: 'Cancelar', value: false }, ...(nuevo || yo ? [] : [{ label: 'Eliminar', value: 'del', cls: 'btn-ghost' }]), { label: 'Guardar', value: true, primary: true }]);
    const r = await p; if (!r) return;
    const g = (id) => document.getElementById(id);
    try {
      if (r === 'del') {
        if (!(await confirmBox(`¿Eliminar el perfil <b>${esc(b.nombre)}</b>? Ya no podrá entrar al panel. Su historial de turnos se conserva.`, 'Eliminar', 'Cancelar', true))) return;
        await call('gbl_admin_eliminar_barbero', { p_id: b.id }); INFO = await rpc('gbl_info'); toast('Perfil eliminado'); return vistaAjustes();
      }
      await call('gbl_admin_guardar_barbero', { p_id: b.id || null, p_nombre: g('eb_n').value, p_especialidad: g('eb_e').value, p_pin: g('eb_p').value.trim() || null,
        p_activo: g('eb_a').checked, p_es_dueno: g('eb_d').checked, p_orden: b.orden ?? null, p_color: radio('pcol') || b.color, p_icono: radio('pico') || b.icono });
      INFO = await rpc('gbl_info');
      if (yo) { ME = await rpc('gbl_yo', { p_token: TOKEN }); TAB = 'ajustes'; arrancar(); }
      toast(nuevo ? 'Perfil creado' : 'Perfil actualizado'); if (!yo) vistaAjustes();
    } catch (e) { alertBox(esc(e.message)); }
  };
  document.getElementById('addBar') && (document.getElementById('addBar').onclick = () => editarBarbero(null));
  v.querySelectorAll('[data-eb]').forEach((x) => x.onclick = () => editarBarbero(d.barberos.find((y) => y.id === x.dataset.eb)));
}

/* ================= ARRANQUE ================= */
let loadedAt = Date.now();
(async function () {
  try { INFO = await rpc('gbl_info'); loadedAt = Date.now(); }
  catch (e) { root.innerHTML = `<div class="login"><p class="msg">${esc(e.message)}</p></div>`; return; }
  if (TOKEN) { try { ME = await rpc('gbl_yo', { p_token: TOKEN }); return arrancar(); } catch (e) { localStorage.removeItem(TK); TOKEN = null; } }
  vistaLogin();
})();
</script>
