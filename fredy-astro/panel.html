<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel · Fredy Astro</title>
  <meta name="theme-color" content="#0a0c17">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0c17' stroke='%23d8b06a'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='%23d8b06a'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Archivo:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .pin { min-height: 80svh; display: grid; place-items: center; text-align: center; }
    .pin .in { text-align: center; font-size: 28px; letter-spacing: .5em; max-width: 220px; margin: 18px auto 12px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 8px; }
    @media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: rgba(26, 30, 58, .55); }
    .kpi small { color: var(--star-2); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
    .kpi b { display: block; font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 4vw, 34px); color: var(--gold-2); margin-top: 4px; }
    .kpi span { font-size: 12.5px; color: var(--star-2); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 22px 0 18px; }
    .tab { border: 0; background: transparent; padding: 12px 14px; color: var(--star-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; }
    .tab.on { color: var(--star); border-color: var(--gold); }
    .dia-t { font-family: var(--serif); font-size: 22px; margin: 22px 0 10px; text-transform: capitalize; }
    .cita { display: grid; grid-template-columns: 74px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: rgba(26, 30, 58, .5); margin-bottom: 10px; }
    .cita.nueva { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(216, 176, 106, .3) inset, 0 0 40px -16px rgba(216, 176, 106, .7); }
    .cita .h { font-family: var(--serif); font-size: 24px; color: var(--gold-2); line-height: 1.1; }
    .cita .h small { display: block; font-family: var(--sans); font-size: 11px; color: var(--star-2); }
    .cita h4 { margin: 0; font-size: 17px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 8px; }
    .b { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--star-2); }
    .b.ok { color: var(--ok); border-color: rgba(63, 191, 127, .45); } .b.warn { color: var(--warn); border-color: rgba(227, 163, 58, .5); } .b.gold { color: var(--night); background: var(--gold); border-color: var(--gold); }
    .mapa { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--star-2); }
    .mapa span { border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; }
    .mapa b { color: var(--gold); font-weight: 600; }
    .acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .bar { display: grid; grid-template-columns: 170px 1fr 110px; gap: 12px; align-items: center; font-size: 14px; padding: 6px 0; }
    @media (max-width: 560px) { .bar { grid-template-columns: 110px 1fr 90px; font-size: 12.5px; } }
    .bar i { display: block; height: 12px; border-radius: 9px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
    .pa { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: rgba(216,176,106,.16); color: var(--gold-2); vertical-align: 2px; margin-right: 4px; }
    .bar span:last-child { text-align: right; color: var(--gold-2); font-weight: 600; }
  </style>
</head>
<body>
  <canvas class="cielo" id="cielo" aria-hidden="true"></canvas>
  <div class="demo-bar">DEMO · PIN 2026 · datos de ejemplo guardados solo en este dispositivo</div>
  <header class="top"><div class="wrap"><a class="brand" href="index.html"><span class="mark">✦</span>Panel <b>Fredy</b></a><div style="display:flex;gap:8px"><a class="btn btn--sm btn--ghost" href="agendar.html">+ Cita</a><button class="btn btn--sm btn--ghost" id="salir" hidden>Salir</button></div></div></header>
  <main class="wrap" style="padding-bottom:80px">
    <div class="pin" id="pin">
      <div><span class="mark" style="width:64px;height:64px;font-size:30px;margin:0 auto">✦</span><h1 class="display" style="font-size:42px;margin-top:16px">Hola, <em>Fredy</em></h1><p class="muted">Escribe tu PIN para entrar</p>
        <form id="fpin"><input class="in" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><br><button class="btn">Entrar</button></form><p class="nota">PIN de la demo: 2026</p></div>
    </div>
    <div id="app" hidden>
      <p class="label" style="margin-top:24px" id="hoyTxt"></p>
      <h1 class="display" style="font-size:clamp(34px,6vw,54px)">Buen día, <em>Fredy</em></h1>
      <div class="kpis" id="kpis"></div>
      <div class="tabs" id="tabs"></div>
      <div id="vista"></div>
      <div style="margin-top:40px;text-align:center"><button class="btn btn--ghost btn--sm" id="reset">↺ Reiniciar demo</button></div>
    </div>
  </main>
  <script src="assets/astro.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    cielo($('#cielo'));
    const iso = (d) => d.toISOString().slice(0, 10);
    const HOY = iso(new Date(new Date().setHours(0, 0, 0, 0)));
    let tab = 'agenda';
    const entrar = () => { $('#pin').hidden = true; $('#app').hidden = false; $('#salir').hidden = false; try { sessionStorage.setItem('fa_pin', '1'); } catch (e) {} pintar(); };
    $('#fpin').onsubmit = (e) => { e.preventDefault(); if ($('#pinIn').value === CONFIG.pin) entrar(); else { toast('PIN incorrecto'); $('#pinIn').value = ''; } };
    $('#salir').onclick = () => { try { sessionStorage.removeItem('fa_pin'); } catch (e) {} location.reload(); };
    $('#reset').onclick = () => { Store.reset(); toast('Demo reiniciada'); pintar(); };

    const mapa = (nac, h, c) => { if (!nac) return ''; const x = ASTRO.carta(nac, h, c); return `<div class="mapa"><span>☉ <b>${x.sol.n}</b> ${x.sol.grado}°</span><span>☾ <b>${x.luna.n}</b> ${x.luna.grado}°</span><span>↑ <b>${x.asc ? x.asc.n : '—'}</b>${x.asc ? ' ' + x.asc.grado + '°' : ' sin hora'}</span></div>`; };
    const hora12 = (h) => { const a = +h.slice(0, 2); return `${((a + 11) % 12) + 1}:${h.slice(3)}<small>${a >= 12 ? 'p. m.' : 'a. m.'}</small>`; };
    const MODO = { video: 'Videollamada', llamada: 'Llamada', presencial: 'Presencial' };

    function tarjeta(c) {
      const s = srv(c.servicio) || { n: c.servicio, ico: '✦', cop: 0, tipo: 'sesion' };
      const enlace = waLink(`Hola ${c.nombre.split(' ')[0]} ✨ Soy Fredy Astro. Te espero ${c.fecha === HOY ? 'hoy' : 'el ' + fechaLarga(c.fecha)} a las ${c.hora}. Enlace de la videollamada: https://meet.google.com/abc-defg-hij`, c.tel ? '57' + c.tel.replace(/\D/g, '').slice(-10) : CONFIG.wa);
      return `<article class="cita ${c.nueva ? 'nueva' : ''}" data-id="${c.id}">
        <div class="h">${s.tipo === 'sesion' ? hora12(c.hora) : `<span style="font-size:30px">${s.ico}</span>`}</div>
        <div><h4><span class="pa">${c.pais}</span> ${c.nombre}</h4>
          <div class="badges">${c.nueva ? '<span class="b gold">NUEVA</span>' : ''}<span class="b">${s.n}</span>${c.modo ? `<span class="b">${MODO[c.modo] || ''}</span>` : ''}<span class="b ${c.pago === 'pagado' ? 'ok' : 'warn'}">${c.pago === 'pagado' ? '✓ Pagado ' + cop(s.cop) : '⏳ Pago pendiente'}</span><span class="b">${c.estado}</span></div>
          <div class="muted" style="font-size:13px;margin-bottom:6px">Vive en ${c.ciudad}${c.nac ? ` · nació el ${c.nac} ${c.hnac ? 'a las ' + c.hnac : '(sin hora)'} en ${c.cnac}` : ''}</div>
          ${mapa(c.nac, c.hnac, c.cnac)}
          ${c.nac2 ? `<div class="muted" style="font-size:13px;margin:8px 0 6px">${c.nombre2 || 'Pareja'}: ${c.nac2} ${c.hnac2 || ''} en ${c.cnac2}</div>${mapa(c.nac2, c.hnac2, c.cnac2)}` : ''}
          ${c.nota ? `<p style="font-size:13.5px;margin:8px 0 0">📝 ${c.nota}</p>` : ''}
          <div class="acc">${s.tipo === 'sesion' && c.estado === 'confirmada' ? `<a class="btn btn--sm" target="_blank" rel="noopener" href="${enlace}">Enviar enlace</a>` : ''}${c.pago !== 'pagado' ? '<button class="btn btn--sm btn--ghost" data-a="pagar">Marcar pagado</button>' : ''}${['confirmada', 'en proceso'].includes(c.estado) ? `<button class="btn btn--sm btn--ghost" data-a="ok">${s.tipo === 'sesion' ? 'Sesión hecha' : 'Entregado'}</button>` : ''}</div>
        </div></article>`;
    }

    function pintar() {
      const C = Store.get();
      const mes = HOY.slice(0, 7);
      const pagadas = C.filter((c) => c.pago === 'pagado');
      const ventasMes = pagadas.filter((c) => (c.creada || c.fecha).slice(0, 7) === mes || c.fecha.slice(0, 7) === mes).reduce((a, c) => a + (srv(c.servicio)?.cop || 0), 0) + 1850000;
      const recurrente = MIEMBROS_DEMO * srv('circulo').cop;
      const hoy = C.filter((c) => c.fecha === HOY && srv(c.servicio)?.tipo === 'sesion').sort((a, b) => a.hora.localeCompare(b.hora));
      const pend = C.filter((c) => c.pago !== 'pagado').reduce((a, c) => a + (srv(c.servicio)?.cop || 0), 0);
      const intl = Math.round(C.filter((c) => c.pais !== 'CO').length / C.length * 100);
      $('#hoyTxt').textContent = fechaLarga(HOY);
      $('#kpis').innerHTML = [['Ventas del mes', cop(ventasMes + recurrente), 'incluye Círculo Astro'], ['Citas hoy', hoy.length, hoy[0] ? 'primera a las ' + hoy[0].hora : 'día libre'], ['Por cobrar', cop(pend), C.filter((c) => c.pago !== 'pagado').length + ' pendientes'], ['Clientes del exterior', intl + '%', 'pagan en dólares']]
        .map(([a, b, c]) => `<div class="kpi"><small>${a}</small><b>${b}</b><span>${c}</span></div>`).join('');
      const nuevas = C.filter((c) => c.nueva).length;
      const T = [['agenda', 'Agenda'], ['pedidos', 'Lecturas por entregar'], ['cursos', 'Cursos'], ['circulo', 'Círculo Astro'], ['ventas', 'Ventas'], ['nuevas', `Nuevas${nuevas ? ' (' + nuevas + ')' : ''}`]];
      $('#tabs').innerHTML = T.map(([k, n]) => `<button class="tab ${tab === k ? 'on' : ''}" data-t="${k}">${n}</button>`).join('');
      const V = $('#vista');
      if (tab === 'agenda') {
        const fut = C.filter((c) => c.fecha >= HOY && srv(c.servicio)?.tipo === 'sesion').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
        const dias = [...new Set(fut.map((c) => c.fecha))];
        V.innerHTML = dias.length ? dias.map((d) => `<div class="dia-t">${d === HOY ? 'Hoy' : fechaLarga(d)}</div>${fut.filter((c) => c.fecha === d).map(tarjeta).join('')}`).join('') : '<p class="muted">No hay citas próximas.</p>';
      } else if (tab === 'pedidos') {
        const p = C.filter((c) => ['entrega', 'regalo'].includes(srv(c.servicio)?.tipo)).reverse();
        V.innerHTML = p.map(tarjeta).join('') || '<p class="muted">Nada pendiente.</p>';
      } else if (tab === 'cursos') {
        const al = C.filter((c) => srv(c.servicio)?.tipo === 'curso');
        const grupos = [...new Set(al.map((c) => c.servicio + '|' + c.grupo))];
        V.innerHTML = grupos.map((g) => { const [sid, gr] = g.split('|'); const l = al.filter((c) => c.servicio === sid && c.grupo === gr); return `<div class="card" style="margin-bottom:12px"><p class="label">${srv(sid).n}</p><h3>Grupo del ${fechaLarga(gr)}</h3><p class="muted">${l.length} inscritos · ${cop(l.filter((c) => c.pago === 'pagado').length * srv(sid).cop)} recaudado</p>${l.map((c) => `<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:14.5px"><span><span class="pa">${c.pais}</span> ${c.nombre}</span><span class="b ${c.pago === 'pagado' ? 'ok' : 'warn'}">${c.pago}</span></div>`).join('')}</div>`; }).join('') || '<p class="muted">Sin inscritos.</p>';
      } else if (tab === 'circulo') {
        const nuevos = C.filter((c) => c.servicio === 'circulo').length;
        V.innerHTML = `<div class="grid g3"><div class="kpi"><small>Miembros activos</small><b>${MIEMBROS_DEMO + nuevos}</b><span>+${4 + nuevos} este mes</span></div><div class="kpi"><small>Ingreso fijo mensual</small><b>${cop((MIEMBROS_DEMO + nuevos) * srv('circulo').cop)}</b><span>se cobra solo cada mes</span></div><div class="kpi"><small>Próximo en vivo</small><b>Luna nueva</b><span>miércoles 7:00 p. m.</span></div></div>
          <div class="card" style="margin-top:14px"><p class="label">Así crece</p>${[50, 100, 200].map((n) => `<div class="bar"><span>${n} miembros</span><i style="width:${n / 2}%"></i><span>${cop(n * srv('circulo').cop)}/mes</span></div>`).join('')}<p class="nota">El Círculo es ingreso que llega todos los meses, aunque Fredy no haga lecturas nuevas.</p></div>`;
      } else if (tab === 'ventas') {
        const porS = {}; pagadas.forEach((c) => { porS[c.servicio] = (porS[c.servicio] || 0) + (srv(c.servicio)?.cop || 0); });
        const porP = {}; C.forEach((c) => { porP[c.pais] = (porP[c.pais] || 0) + 1; });
        const mx = Math.max(...Object.values(porS)), mp = Math.max(...Object.values(porP));
        V.innerHTML = `<div class="grid g2"><div class="card"><p class="label">Por servicio</p>${Object.entries(porS).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${srv(k)?.n || k}</span><i style="width:${v / mx * 100}%"></i><span>${cop(v)}</span></div>`).join('')}</div>
          <div class="card"><p class="label">Clientes por país</p>${Object.entries(porP).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${PAISES[k] || k}</span><i style="width:${v / mp * 100}%"></i><span>${v}</span></div>`).join('')}</div></div>`;
      } else if (tab === 'nuevas') {
        const n = C.filter((c) => c.nueva).reverse();
        V.innerHTML = n.length ? n.map(tarjeta).join('') : '<div class="card" style="text-align:center"><p class="muted">Aún no hay reservas nuevas desde la página.</p><a class="btn" href="agendar.html">Hacer una reserva de prueba</a></div>';
      }
    }
    $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; pintar(); } });
    $('#vista').addEventListener('click', (e) => {
      const b = e.target.closest('[data-a]'); if (!b) return; const id = b.closest('[data-id]').dataset.id;
      if (b.dataset.a === 'pagar') { Store.upd(id, { pago: 'pagado' }); toast('Pago registrado ✓'); }
      if (b.dataset.a === 'ok') { const c = Store.get().find((x) => x.id === id); Store.upd(id, { estado: srv(c.servicio).tipo === 'sesion' ? 'completada' : 'entregada', nueva: false }); toast('Listo ✓'); }
      pintar();
    });
    // si hay reservas nuevas, abre esa pestaña primero
    if (Store.get().some((c) => c.nueva)) tab = 'nuevas';
    try { if (sessionStorage.getItem('fa_pin')) entrar(); } catch (e) {}
  </script>
</body>
</html>
