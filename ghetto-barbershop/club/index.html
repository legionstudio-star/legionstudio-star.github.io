<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0909">
<title>Club Ghetto · Ghetto Barbershop SM</title>
<meta name="description" content="Tu tarjeta de sellos de Ghetto Barbershop SM. Cada visita suma; completa la tarjeta y tu corte va por la casa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/img/icono-192.png">
<link rel="apple-touch-icon" href="../assets/img/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club Ghetto">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/gb.css">
<style>
  body{min-height:100svh;background:radial-gradient(ellipse at 50% -10%,#2a1218 0%,var(--bg) 55%);}
  .app{max-width:460px;margin:0 auto;padding:22px 18px 40px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .top img{height:54px;}
  .top a{font-size:13px;color:var(--muted);text-decoration:underline;}
  h1{font-family:var(--gothic);font-weight:400;font-size:58px;line-height:.95;}
  .lead{color:rgba(245,238,225,.82);margin:12px 0 22px;}
  .perks{display:grid;gap:10px;margin-bottom:24px;}
  .perk{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .perk b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;}
  .perk span{color:var(--muted);font-size:13px;}
  .perk .ic{flex:0 0 44px;height:44px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--gothic);font-size:24px;color:var(--rose);}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:4px 0 16px;}
  .check input{margin-top:3px;accent-color:var(--red2);width:18px;height:18px;}
  .full{width:100%;}
  .msg{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-top:10px;}
  .alt{text-align:center;margin-top:18px;font-size:14px;color:var(--muted);}
  .alt button{background:none;border:0;color:var(--rose);font-weight:700;text-decoration:underline;}

  /* TARJETA */
  .card{position:relative;background:var(--cream);color:#111;border-radius:22px;padding:22px 20px 20px;box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden;}
  .card::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(168,50,70,.18),transparent 70%);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
  .card-top img{height:64px;}
  .card-top .lbl{text-align:right;font-family:var(--display);letter-spacing:.16em;font-size:12px;}
  .card-top .lbl b{display:block;font-family:var(--gothic);font-weight:400;letter-spacing:0;font-size:30px;line-height:1;margin-top:4px;}
  .stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 16px;position:relative;}
  .st{aspect-ratio:1;border-radius:50%;border:2px dashed #b9b0a3;display:flex;align-items:center;justify-content:center;font-family:var(--gothic);font-size:28px;color:transparent;transition:.3s;}
  .st.f{border:0;background:#111;color:var(--cream);}
  .st.f.pop{animation:stamp .7s cubic-bezier(.34,1.56,.64,1);}
  @keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
  .st.g{border:2px solid var(--red);color:var(--red);font-family:var(--display);font-size:10.5px;font-weight:700;line-height:1.1;text-align:center;}
  .st.g.f{background:var(--red);color:#fff;}
  .bar{height:8px;border-radius:8px;background:#e2d9cb;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:8px;transition:width .6s;}
  .card-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#5c544b;}
  .card-foot b{color:#111;}
  .full-banner{margin-top:14px;background:#111;color:var(--cream);border-radius:14px;padding:14px;text-align:center;font-weight:700;}
  .full-banner b{font-family:var(--gothic);font-weight:400;font-size:28px;display:block;}

  .qr-box{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;}
  .qr{flex:0 0 120px;height:120px;background:#fff;border-radius:12px;padding:6px;}
  .qr svg{width:100%;height:100%;}
  .qr-box p{font-size:13.5px;color:var(--muted);}
  .qr-box .code{font-family:var(--display);font-size:26px;letter-spacing:.2em;color:var(--cream);margin-top:6px;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .hist{margin-top:18px;}
  .hist h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .hist div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px;}
  .hist span{color:var(--muted);}
  .install{margin-top:18px;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;line-height:1.6;}
  .install b{color:var(--cream);}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden;}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 2.6s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main class="app" id="app"><div style="text-align:center;padding:80px 0"><span class="spin"></span></div></main>

<script src="../assets/gb.js"></script>
<script src="../assets/qrcode.js"></script>
<script>
const { rpc, esc, dateShort, toast } = GB;
const KEY = 'ghetto_club_codigo';
const app = document.getElementById('app');
let INFO = null, last = null, timer = null;

function qrSvg(txt) {
  const q = qrcode(0, 'M'); q.addData(txt); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="Código QR de tu tarjeta"><path d="${d}" fill="#0a0909"/></svg>`;
}
const cardUrl = (c) => location.origin + location.pathname + '?c=' + encodeURIComponent(c);
const cabecera = (link) => `<div class="top"><a href="../" style="text-decoration:none"><img src="../assets/img/logo-ghetto-oscuro.png" alt="Ghetto Barbershop SM"></a>${link || ''}</div>`;

function vistaUnirse(err) {
  const meta = (INFO && INFO.config.meta_sellos) || 8, premio = (INFO && INFO.config.premio) || 'Corte gratis';
  app.innerHTML = `${cabecera('<a href="../#agenda">Agendar turno</a>')}
    <h1>Club Ghetto</h1>
    <p class="lead">Tu tarjeta de sellos en el celular. Sin apps, sin papelitos.</p>
    <div class="perks">
      <div class="perk"><span class="ic">G</span><div><b>Un sello por visita</b><span>El barbero lo pone al terminar tu corte.</span></div></div>
      <div class="perk"><span class="ic">${meta}</span><div><b>${esc(premio)}</b><span>Al completar ${meta} sellos.</span></div></div>
      <div class="perk"><span class="ic">✦</span><div><b>Primer sello de regalo</b><span>Solo por unirte hoy.</span></div></div>
    </div>
    <form class="box" id="f" novalidate>
      <div class="field"><label for="n">Tu nombre</label><input id="n" autocomplete="name" maxlength="60" placeholder="Nombre y apellido"></div>
      <div class="field"><label for="t">Tu WhatsApp</label><input id="t" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="300 000 0000"></div>
      <label class="check"><input type="checkbox" id="ok" checked> Acepto que Ghetto Barbershop guarde mi nombre y número para mi tarjeta y me escriba con promociones del Club.</label>
      <button class="btn btn-red full" id="go">Crear mi tarjeta</button>
      <div class="msg" id="m" role="alert">${esc(err || '')}</div>
    </form>
    <p class="alt">¿Ya tienes tarjeta? <button type="button" id="ya">Entrar con mi código</button></p>`;
  document.getElementById('ya').onclick = vistaCodigo;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const n = document.getElementById('n').value.trim(), t = document.getElementById('t').value.replace(/\D/g, '').slice(-10);
    const m = document.getElementById('m'), go = document.getElementById('go');
    if (n.length < 2) { m.textContent = 'Escribe tu nombre.'; return; }
    if (t.length !== 10) { m.textContent = 'Escribe tu WhatsApp (10 dígitos).'; return; }
    if (!document.getElementById('ok').checked) { m.textContent = 'Necesitamos tu autorización para crear la tarjeta.'; return; }
    go.disabled = true; go.innerHTML = '<span class="spin"></span>';
    try {
      const r = await rpc('gb_club_unirse', { p_nombre: n, p_tel: t });
      localStorage.setItem(KEY, r.codigo);
      history.replaceState(null, '', '?c=' + r.codigo);
      await cargarTarjeta(r.codigo, true);
      confeti();
      toast('¡Bienvenido al Club Ghetto! Tu primer sello ya está puesto.');
    } catch (err) { m.textContent = err.message; go.disabled = false; go.textContent = 'Crear mi tarjeta'; }
  };
}

function vistaCodigo() {
  app.innerHTML = `${cabecera('<a href="./">Volver</a>')}
    <h1>Tu tarjeta</h1>
    <p class="lead">Escribe el código de 6 letras de tu tarjeta. Si no lo tienes, pídeselo al barbero: lo encuentra con tu número.</p>
    <form class="box" id="f" novalidate>
      <div class="field"><label for="c">Código</label><input id="c" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="EJ: K7Q2MN" style="text-transform:uppercase;letter-spacing:.2em;font-family:var(--display);font-size:22px"></div>
      <button class="btn btn-cream full">Ver mi tarjeta</button>
      <div class="msg" id="m" role="alert"></div>
    </form>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const c = document.getElementById('c').value.trim().toUpperCase();
    if (c.length !== 6) { document.getElementById('m').textContent = 'El código tiene 6 caracteres.'; return; }
    const ok = await cargarTarjeta(c, true);
    if (!ok) document.getElementById('m').textContent = 'No encontramos ese código.';
  };
}

async function cargarTarjeta(codigo, guardar) {
  const t = await rpc('gb_club_tarjeta', { p_codigo: codigo });
  if (!t) return false;
  if (guardar) { localStorage.setItem(KEY, t.codigo); history.replaceState(null, '', '?c=' + t.codigo); }
  const subio = last && t.sellos > last.sellos, canjeo = last && t.canjes > last.canjes;
  vistaTarjeta(t, subio ? t.sellos - 1 : -1);
  if (subio) { toast('¡Nuevo sello! Ya llevas ' + t.sellos + ' de ' + t.meta); if (t.sellos >= t.meta) confeti(); }
  if (canjeo) toast('Premio canjeado. ¡Disfrútalo! La tarjeta vuelve a empezar.');
  last = t;
  clearInterval(timer);
  timer = setInterval(async () => { if (document.hidden) return; try { const n = await rpc('gb_club_tarjeta', { p_codigo: t.codigo }); if (n && (n.sellos !== last.sellos || n.canjes !== last.canjes)) cargarTarjeta(t.codigo); } catch (e) {} }, 15000);
  return true;
}

function vistaTarjeta(t, popIdx) {
  const meta = t.meta, faltan = Math.max(0, meta - t.sellos);
  const stamps = Array.from({ length: meta }, (_, i) => {
    const f = i < t.sellos, g = i === meta - 1;
    return `<div class="st ${f ? 'f' : ''} ${g ? 'g' : ''} ${i === popIdx ? 'pop' : ''}">${g ? (f ? '¡GRATIS!' : 'CORTE<br>GRATIS') : 'G'}</div>`;
  }).join('');
  const nombres = { bienvenida: 'Sello de bienvenida', sello: 'Sello por visita', canje: 'Premio canjeado' };
  const ios = /iphone|ipad/i.test(navigator.userAgent);
  app.innerHTML = `${cabecera('<a href="../#agenda">Agendar turno</a>')}
    <div class="card">
      <div class="card-top"><img src="../assets/img/logo-ghetto.png" alt=""><div class="lbl">CLUB GHETTO<b>${esc(t.nombre)}</b></div></div>
      <div class="stamps">${stamps}</div>
      <div class="bar"><i style="width:${Math.min(100, (t.sellos / meta) * 100)}%"></i></div>
      <div class="card-foot"><span><b>${t.sellos}</b> de ${meta} sellos</span><span>${faltan ? `Te falta${faltan > 1 ? 'n' : ''} <b>${faltan}</b>` : '<b>¡Tarjeta llena!</b>'}</span></div>
      ${faltan ? '' : `<div class="full-banner"><b>${esc(t.premio || 'Corte gratis')}</b>Muéstrale esta tarjeta al barbero para canjearlo.</div>`}
    </div>
    <div class="qr-box">
      <div class="qr">${qrSvg(cardUrl(t.codigo))}</div>
      <div><p>Muéstrale este código al barbero para que te ponga el sello.</p><div class="code">${esc(t.codigo)}</div></div>
    </div>
    <div class="actions">
      <a class="btn btn-ghost btn-sm" href="../#agenda">Agendar</a>
      <button class="btn btn-ghost btn-sm" id="share" type="button">Guardar enlace</button>
    </div>
    <div class="install">${ios
      ? 'Para tenerla siempre a mano: toca <b>Compartir</b> y luego <b>Agregar a inicio</b>. Queda como una app en tu celular.'
      : 'Para tenerla siempre a mano: abre el menú <b>⋮</b> del navegador y toca <b>Agregar a la pantalla principal</b>.'}</div>
    <div class="hist"><h3>Movimientos</h3>${(t.historial || []).map((h) => `<div><b>${nombres[h.tipo] || h.tipo}</b><span>${esc(dateShort(h.fecha))}</span></div>`).join('')}</div>
    <p class="alt" style="margin-top:26px"><button type="button" id="otra">No es mi tarjeta</button></p>`;
  document.getElementById('share').onclick = async () => {
    const url = cardUrl(t.codigo);
    try { if (navigator.share) await navigator.share({ title: 'Mi tarjeta Club Ghetto', url }); else { await navigator.clipboard.writeText(url); toast('Enlace copiado'); } } catch (e) {}
  };
  document.getElementById('otra').onclick = () => { localStorage.removeItem(KEY); last = null; clearInterval(timer); history.replaceState(null, '', location.pathname); vistaUnirse(); };
}

function confeti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#f5eee1', '#c8435b', '#4459b0', '#c9a84a'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 4];
    p.style.animationDelay = Math.random() * .8 + 's'; p.style.animationDuration = 2 + Math.random() * 1.5 + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}

(async function () {
  try { INFO = await rpc('gb_info'); } catch (e) {}
  const c = new URLSearchParams(location.search).get('c') || localStorage.getItem(KEY);
  if (c) {
    try { if (await cargarTarjeta(c, true)) return; } catch (e) { app.innerHTML = `<p class="msg">${esc(e.message)}</p>`; return; }
    localStorage.removeItem(KEY);
  }
  vistaUnirse();
})();
</script>
</body>
</html>
